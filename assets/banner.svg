<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes floatGrid {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
        100% { transform: translateY(0px); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 0.6; transform: scale(1.05); }
      }
      @keyframes dashLine {
        to { stroke-dashoffset: -40; }
      }
      .bg-grid {
        animation: floatGrid 8s ease-in-out infinite;
      }
      .glowing-orb {
        transform-origin: center;
        animation: pulseGlow 6s ease-in-out infinite;
      }
      .flow-line {
        stroke-dasharray: 8 8;
        animation: dashLine 2s linear infinite;
      }
      .title-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 48px;
        fill: #ffffff;
      }
      .subtitle-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        font-size: 20px;
        fill: #94a3b8;
      }
      .pill-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
        fill: #e2e8f0;
      }
    </style>
  </defs>

  <!-- Base Dark Background -->
  <rect width="1200" height="320" rx="16" fill="url(#bgGrad)"/>

  <!-- Dynamic Glowing Orbs in Background (Layered BEHIND content) -->
  <circle class="glowing-orb" cx="150" cy="80" r="120" fill="#6366f1" filter="url(#glow)"/>
  <circle class="glowing-orb" cx="1050" cy="240" r="140" fill="#ec4899" filter="url(#glow)"/>

  <!-- Background Decorative Grid -->
  <g class="bg-grid" opacity="0.12" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="40" x2="1200" y2="40"/>
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="220" x2="1200" y2="220"/>
    <line x1="0" y1="280" x2="1200" y2="280"/>
    <line x1="150" y1="0" x2="150" y2="320"/>
    <line x1="350" y1="0" x2="350" y2="320"/>
    <line x1="550" y1="0" x2="550" y2="320"/>
    <line x1="750" y1="0" x2="750" y2="320"/>
    <line x1="950" y1="0" x2="950" y2="320"/>
    <line x1="1150" y1="0" x2="1150" y2="320"/>
  </g>

  <!-- Dynamic Animated Flow Line at Bottom Background -->
  <path class="flow-line" d="M 50 270 Q 300 240 600 270 T 1150 250" fill="none" stroke="url(#accentGrad)" stroke-width="3" opacity="0.5"/>

  <!-- Foreground Main Card Container (Guarantees Text Legibility & Foreground Priority) -->
  <rect x="60" y="40" width="1080" height="240" rx="12" fill="#0f172a" fill-opacity="0.75" stroke="#334155" stroke-width="1.5"/>

  <!-- Top Accent Bar -->
  <rect x="60" y="40" width="1080" height="6" rx="3" fill="url(#accentGrad)"/>

  <!-- Main Title -->
  <text x="100" y="115" class="title-text">Awesome Revenue Cloud &amp; Billing 💳 🚀</text>

  <!-- Subtitle -->
  <text x="100" y="155" class="subtitle-text">Curated SaaS Platforms, Usage Metering &amp; Open-Source Billing Engines</text>

  <!-- Feature Badges/Pills in Foreground Container -->
  <g transform="translate(100, 185)">
    <!-- Pill 1: Subscription Management -->
    <rect x="0" y="0" width="200" height="34" rx="17" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <circle cx="17" cy="17" r="6" fill="#10b981"/>
    <text x="32" y="22" class="pill-text">Subscription Billing</text>

    <!-- Pill 2: Usage Metering -->
    <rect x="215" y="0" width="175" height="34" rx="17" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <circle cx="232" cy="17" r="6" fill="#6366f1"/>
    <text x="247" y="22" class="pill-text">Usage Metering</text>

    <!-- Pill 3: Revenue Recognition -->
    <rect x="405" y="0" width="205" height="34" rx="17" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <circle cx="422" cy="17" r="6" fill="#f59e0b"/>
    <text x="437" y="22" class="pill-text">ASC 606 &amp; Compliance</text>

    <!-- Pill 4: Open Source -->
    <rect x="625" y="0" width="190" height="34" rx="17" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <circle cx="642" cy="17" r="6" fill="#ec4899"/>
    <text x="657" y="22" class="pill-text">Open Source Engines</text>
  </g>

  <!-- Right Decorative Icon graphic -->
  <g transform="translate(980, 85)" opacity="0.85">
    <rect x="0" y="0" width="100" height="110" rx="12" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <path d="M 20 30 L 80 30 M 20 50 L 60 50 M 20 70 L 75 70 M 20 90 L 45 90" stroke="url(#accentGrad)" stroke-width="4" stroke-linecap="round"/>
    <circle cx="75" cy="85" r="14" fill="#a855f7"/>
    <path d="M 70 85 L 73 88 L 80 81" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  </g>
</svg>
